# NicJK dedicated server
#
# Pull from registry:
#   docker compose pull && docker compose up
#
# Build from source:
#   docker compose --profile build up
#
# Requirements:
#   Copy your retail Jedi Academy base assets into ./base:
#     ./base/assets0.pk3
#     ./base/assets1.pk3
#     ...
#
# Server configuration:
#   A default server.cfg is included in the image.
#   To override it, place your server.cfg in the homepath directory:
#     ./homepath/nicjk/server.cfg
#
# Custom PK3s:
#   Base JKA maps/assets go in ./base.
#   NicJK-specific PK3s go in ./homepath/nicjk.

services:
  nicjk:
    image: ghcr.io/taysta/taystjk:latest
    ports:
      - "29070:29070/udp"
      - "18200:18200/tcp"
    volumes:
      - ./base:/opt/nicjk/cdpath/base
      - ./homepath:/opt/nicjk/homepath
    environment:
      - TJK_MOD=nicjk
      - TJK_ARCH=x86_64
    restart: unless-stopped

  nicjk-build:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NICJK_REF: master
        NICJK_COMMIT: unknown
    profiles: ["build"]
    ports:
      - "29070:29070/udp"
      - "18200:18200/tcp"
    volumes:
      - ./base:/opt/nicjk/cdpath/base
      - ./homepath:/opt/nicjk/homepath
    environment:
      - TJK_MOD=nicjk
      - TJK_ARCH=x86_64
    restart: unless-stopped