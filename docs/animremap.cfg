// NicJK Unlimited - per-model animation remapping
//
// Copy this file to GameData/nicjk/animremap.cfg and edit it. Nothing here is
// used until it is switched on:
//   server:  g_animRemap 1   (poses the server's models, needed for "timing" lines)
//   client:  cg_animRemap 1  (what you see)
// After editing, type  animremap_reload  (server / rcon) and
// cg_animremap_reload  (client), or change map.
// animremap_list / cg_animremap_list show what is loaded.
//
// Line format:
//   model[/skin]  ANIMATION  REPLACEMENT  [fit|free|timing]
//
//   model       folder name under models/players (kyle, desann, ...).
//               model/skin applies to one skin only; * applies to every model.
//               More specific lines win: model/skin over model over *.
//   ANIMATION   the animation the game plays for the move (names from anims.h /
//               animation.cfg, e.g. BOTH_STAND2). This is what the server sends
//               and what every game check and bot sees; it does not change.
//   REPLACEMENT the animation this model shows instead. It must exist in the
//               humanoid skeleton (_humanoid.gla), as every animation.cfg name does.
//   mode        fit    (default) the replacement is stretched or squeezed to the
//                      original's length: the move lasts exactly as long as before.
//               free   the replacement plays at its own speed; the move still lasts
//                      as long as before (best for looping stances, idles, runs).
//               timing the replacement plays at its own speed AND the move lasts as
//                      long as the replacement in gameplay. This changes combat
//                      timing. Server and client need the same file, or the client's
//                      prediction gets corrected by the server; stock clients see the
//                      original animation and get those corrections too.
//
// Groups: a name ending in * maps every animation with that prefix to the one
// with the other prefix, e.g.  BOTH_A2_* BOTH_A3_*  maps every medium-style
// saber animation (BOTH_A2_T__B_, BOTH_A2_SPECIAL, ...) to its strong-style twin.
//
// When the files are read, the console shows each remap with both lengths, and
// warns when they differ.
//
// A model can also carry its own file in its pk3, models/players/<model>/animremap.cfg,
// with lines "ANIMATION REPLACEMENT [mode]" (no model column). Lines here override it.
//
// Give any model another skeleton (GLA) - e.g. one of MovieDuels' per-character
// skeletons - without touching the model's files:
//   skeleton  MODEL  GLA
// The GLA must have the humanoid bones and an animation.cfg next to it (MovieDuels'
// _humanoid_vader, _humanoid_luke, ... do). The model is then drawn with that
// skeleton's animations; gameplay timing stays this game's. A model whose own .glm
// already names such a GLA (MovieDuels' own models) needs no line at all.
// Read when the model is loaded: after a change, vid_restart or restart the game.
// Players without the GLA file, or with cg_animRemap 0, see the model as usual.
//skeleton  kyle    models/players/_humanoid_vader/_humanoid
//skeleton  desann  models/players/_humanoid_maul/_humanoid
//
// A model's own animations (its own GLA):
//   animset NAME  GLA  ANIMATION_CFG  [OFFSET]
// names the animations of ANIMATION_CFG (animation.cfg format), whose frames
// start OFFSET frames into GLA. Use them as a replacement written NAME:ANIM.
// They are shown only on a model whose .glm really uses that GLA; anywhere
// else (a client that does not have the model, the server's stand-in model)
// the normal animation is used. Build such a GLA with
// tools/animremap/gla_append.py (the humanoid frames plus extra ones appended)
// and keep it in models/players/_humanoid/ - see docs/NICJK_ANIMREMAP.md.
//
// Lines starting with // or # are comments.

// --- Examples (remove the leading // to use them) ---

// Desann stands in the strong-style stance even with a medium saber style,
// and his medium-style kata and taunt are the strong-style ones (same timing).
//desann  BOTH_STAND2          BOTH_SABERSLOW_STANCE   free
//desann  BOTH_A2_SPECIAL      BOTH_A3_SPECIAL
//desann  BOTH_VICTORY_MEDIUM  BOTH_VICTORY_STRONG

// Every medium-style swing of the reborn model uses the strong-style swing,
// still with medium-style timing.
//reborn  BOTH_A2_*            BOTH_A3_*

// One skin only.
//kyle/default  BOTH_ENGAGETAUNT  BOTH_GESTURE1

// Every model: a different run.
//*  BOTH_RUN1  BOTH_RUN2  free

// A model with its own GLA (normally this goes in the model's own
// models/players/desann_sith/animremap.cfg, without the model column):
//animset sour  models/players/_humanoid/_sith.gla  models/players/_humanoid_t1_sour/animation.cfg  21376
//desann_sith  BOTH_SABERFAST_STANCE  sour:BOTH_CIN_10  free
